workflows:
  android-build:
    name: FlorisBoard Build
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Setup permissions
        script: chmod +x gradlew

      - name: Clean project
        script: ./gradlew clean

      - name: Build APK
        script: ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk

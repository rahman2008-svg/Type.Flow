workflows:
  android-build:
    name: FlorisBoard Android APK Build
    max_build_duration: 60

    environment:
      java: 17
      vars:
        GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true

    scripts:
      - name: Check Java version
        script: |
          java -version

      - name: Setup Gradle permission
        script: |
          chmod +x ./gradlew

      - name: Clean project
        script: |
          ./gradlew clean

      - name: Download dependencies
        script: |
          ./gradlew androidDependencies

      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

workflows:
  android-build:
    name: AnySoftKeyboard Build

    max_build_duration: 60

    environment:
      java: 21

    scripts:
      - name: Verify Java
        script: java -version

      - name: Setup Permission
        script: chmod +x gradlew

      - name: Clean Project
        script: ./gradlew clean --no-daemon

      - name: Build APK
        script: ./gradlew assembleDebug --stacktrace --no-daemon

    artifacts:
      - "**/*.apk"

workflows:
  android-build:
    name: AnySoftKeyboard Build

    max_build_duration: 60

    environment:
      java: 21

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Setup Permission
        script: chmod +x gradlew

      - name: Clean Project
        script: ./gradlew clean

      - name: Build APK
        script: ./gradlew assembleDebug --stacktrace --warning-mode all

    artifacts:
      - "**/*.apk"
